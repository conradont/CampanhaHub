services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: campanhahub
      POSTGRES_USER: campanhahub
      POSTGRES_PASSWORD: campanhahub
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campanhahub"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://campanhahub:campanhahub@db:5432/campanhahub
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000
      SECRET_KEY: altere-esta-chave-em-producao
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
